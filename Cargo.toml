[workspace]
resolver = "2"
members = [
    "crates/arclive-core",
    "crates/arclive-engine",
    "crates/arclive-project",
    "crates/arclive-ui",
    "crates/arclive-app",
]
default-members = ["crates/arclive-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclive/arclive"
rust-version = "1.95"

[workspace.dependencies]
arclive-core = { path = "crates/arclive-core" }
arclive-engine = { path = "crates/arclive-engine" }
arclive-project = { path = "crates/arclive-project" }
arclive-ui = { path = "crates/arclive-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui = "0.34"
eframe = { version = "0.34", default-features = true }
cpal = "0.18"
rtrb = "0.3"
arc-swap = "1"
rfd = "0.15"
anyhow = "1"
hound = "3.5"